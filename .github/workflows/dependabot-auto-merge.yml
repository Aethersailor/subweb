name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: ["main"]
    paths: ['.github/workflows/dependabot-auto-merge.yml']
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Merge Dependabot updates
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          pull_numbers=$(gh api --paginate --method GET "repos/$REPOSITORY/pulls" \
            -f state=open -f base="$DEFAULT_BRANCH" -F per_page=100 \
            --jq '.[] | select(.user.login == "dependabot[bot]") | .number')
          result=0
          while IFS= read -r number; do
            test -n "$number" || continue
            gh api --method PUT "repos/$REPOSITORY/pulls/$number/merge" \
              -f merge_method=squash --jq 'if .merged then .sha else error(.message) end' || result=1
          done <<< "$pull_numbers"
          exit "$result"
